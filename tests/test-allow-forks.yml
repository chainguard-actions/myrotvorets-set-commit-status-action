name: Test allowForks enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          status: success
          sha: ${{ steps.get-sha.outputs.sha }}
          context: "test/allow-forks"
          description: "Test with allowForks enabled"
          allowForks: "true"

      - name: Assert action ran and completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome with allowForks=true"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
