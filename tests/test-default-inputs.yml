name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with default inputs (status=pending)
        uses: .
        with:
          token: fake-token-for-testing
          sha: "abc1234567890abcdef1234567890abcdef12345"
          repo: "test-org/test-repo"
        continue-on-error: true

      - name: Assert action ran with defaults without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Default status is 'pending'. With a fake token the API call will fail,
          # but the action should exit cleanly (not crash with unhandled exception).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with default inputs and exited cleanly (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
