name: Test success status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with success status
        uses: .
        with:
          token: fake-token-for-testing
          status: success
          sha: "abc1234567890abcdef1234567890abcdef12345"
          repo: "test-org/test-repo"
          description: "Build succeeded"
          context: "CI / build"
        continue-on-error: true

      - name: Assert action ran without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token the API call will fail (401/403),
          # but the action should fail gracefully, not crash with an unhandled exception.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with success status and exited cleanly (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
